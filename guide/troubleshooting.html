<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .img-container {
            width: 100%;
            max-width: 1000px; /* Ya 100vw full screen ke liye */
            padding: 10px;
        }

        .img-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="img-container">
        <img src="/image/error-image.png" alt="Status Display">
    </div>

</body>
</html>
